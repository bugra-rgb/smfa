[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "content-factory"
version = "0.1.0"
description = "Çok hesaplı otonom içerik üretim ve yayın yönetimi"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "celery>=5.4,<6", "redis>=5,<7", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "cryptography>=44", "python-multipart>=0.0.20", "argon2-cffi>=23", "prometheus-client>=0.21", "boto3>=1.36", "Pillow>=11", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9", "mypy>=1.14"]

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a real media processor or service", "postgres: needs PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
