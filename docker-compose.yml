name: content-factory

x-app: &app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.backend
  image: ${BACKEND_IMAGE:-content-factory-backend:local}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://factory:${POSTGRES_PASSWORD:?Önce python scripts/bootstrap.py çalıştırın}@postgres:5432/factory
    REDIS_URL: redis://:${REDIS_PASSWORD:?Redis parolası gerekli}@redis:6379/0
    DATA_DIR: /data
  volumes:
    - media_data:/data
  init: false
  cap_drop: [ALL]
  pids_limit: 256
  restart: unless-stopped
  stop_grace_period: 60s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL parolası gerekli}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U factory -d factory']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    shm_size: 256mb

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis parolası gerekli}
    command: [sh, -ec, 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: [sh, -ec, 'alembic upgrade head && python scripts/bootstrap.py --init-admin']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app
    expose: ['8000']
    mem_limit: 768m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: [celery, -A, 'factory.worker:celery_app', worker, --loglevel=INFO, '--hostname=worker@%h']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A factory.worker:celery_app inspect ping -d worker@$$HOSTNAME --timeout=10 | grep -q pong']
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: [python, -m, factory.services.scheduler]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/scheduler-heartbeat').st_mtime < 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://backend:8000
    image: ${FRONTEND_IMAGE:-content-factory-frontend:local}
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - '${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  media_data:
